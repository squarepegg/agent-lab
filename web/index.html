<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-lab · see how the map, evals and gate work</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="boot">Loading Python (Pyodide ~10 MB, cached after the first visit)…</div>
<header id="top"><h1>agent-lab</h1><span class="sub" id="sub"></span>
  <button class="chip" id="find">find <kbd>⌘K</kbd></button><button class="chip" id="share">copy link</button><button class="chip" id="theme">light</button></header>
<nav id="tools" aria-label="modes"></nav>
<main id="stage"><svg id="svg" role="img" aria-label="interactive graph"><g id="vp"></g></svg>
  <div id="toast" role="status"></div><div id="hud"></div>
  <div id="zoom"><button class="chip" id="zin">+</button><button class="chip" id="zout">−</button><button class="chip" id="zfit">fit</button></div></main>
<aside id="drawer" aria-live="polite"></aside>
<footer id="status"><span id="st1"></span><span id="st2"></span></footer>
<div id="pal"><div><input id="pin" placeholder="jump to a file, eval or mode · or type words to search the brain" autocomplete="off"><div id="palist"></div></div></div>
<script type="module" src="app.js"></script>
</body></html>
