# Agentic probes: a question -> substrings the answer must contain (graded by evals/grade.py, no model judge).
# Rule learned the hard way: a probe only measures a skill if the default model CANNOT answer it without the skill.
# Probes the baseline already passes make the gate return CEILING; replace them, don't keep them.
# split: dev (used to decide) | heldout (must not regress; never tune a candidate against it)
# skill: the toolkit skill whose text holds the answer (lets a candidate select `probes: {skill: dst}`)

# --- dst
- id: dst-model-conformance
  skill: dst
  split: dev
  q: "In a deterministic simulation test I replaced a downstream service with a hand-written model. What extra test does that model need, and why? Two sentences."
  expect: [[conformance], [real]]
  max_words: 80
- id: dst-known-bug
  skill: dst
  split: dev
  q: "My simulation shows current behaviour is wrong, but the fix is out of scope for this PR. How should a test that asserts the current behaviour be written?"
  expect: [["known bug", "knownbug", "known-bug"]]
  max_words: 80
- id: dst-pr-tier
  skill: dst
  split: dev
  q: "How many seeds should the PR-tier DST seed sweep run, and may it use Docker? One line."
  expect: [["150"]]
  expect_re: ["(no|without|not|never)\\W+(use\\W+)?docker"]
  max_words: 40
- id: dst-mutation
  skill: dst
  split: heldout
  q: "Before I claim a DST property holds, what must I do to that property? One line."
  expect: [[mutation, mutant]]
  max_words: 40
- id: dst-reach
  skill: dst
  split: heldout
  q: "My simulator found a bug under a fault it injects. What must the finding also state? One line."
  expect_re: ["(production|prod)\\W+(\\w+\\W+){0,6}reach|reach\\w*\\W+(\\w+\\W+){0,6}(production|prod)"]
  max_words: 40

# --- evidence-gated
- id: eg-recommended
  skill: evidence-gated
  split: dev
  q: "In a trade-off table, when may I write '(Recommended)' next to an option? One line."
  expect: [[decisive]]
  max_words: 40
- id: eg-register
  skill: evidence-gated
  split: dev
  q: "Before running the evaluation for an architecture decision, what must happen to the decision file? One line."
  expect: [[commit]]
  max_words: 40
- id: eg-irreversible
  skill: evidence-gated
  split: dev
  q: "For a hard-to-reverse choice (picking a datastore), which two extra committed files does the decision need before it can be decisive?"
  expect: [[attack], [blind]]
  max_words: 60
- id: eg-requirement-tags
  skill: evidence-gated
  split: heldout
  q: "When tagging requirements by source, which tag marks rows that are candidates to drop? Give the tag."
  expect: [["old-behaviour-only", "old behaviour only", "old-behavior-only", "old behavior only"]]
  max_words: 30

# --- doubt
- id: doubt-framing
  skill: doubt
  split: dev
  q: "I want a second model to review my plan before I commit to it. How should its prompt and context be set up? Two lines."
  expect: [[adversarial], [fresh]]
  max_words: 60
- id: doubt-not-summarize
  skill: doubt
  split: heldout
  q: "In a doubt-driven review, name two things the reviewer is told NOT to do."
  expect: [[validate], [summarize, summarise]]
  max_words: 40

# --- regen / implementation-memory-audit
- id: ima-blame
  skill: regen
  split: dev
  q: "I'm tracing why an odd retry exists in old code. Can I trust git blame to give me the commit that introduced it? One line."
  expect_re: ["\\b(no|not|don't|never|cannot|can't)\\b"]
  forbid: ["yes, git blame", "yes, you can trust"]
  max_words: 40
- id: ima-lesson-forms
  skill: regen
  split: heldout
  q: "In an implementation-memory audit, which labelled forms may a lesson take? List them."
  expect: [[stated], [inferred]]
  max_words: 40
